<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0b0c" />
    <meta
      name="description"
      content="Vikas Bhardwaj — full-stack and applied AI product engineer in Jammu & Kashmir. End-to-end web apps, agentic workflows, and native browser/system tools."
    />
    <link rel="canonical" href="https://portfolio-vikas-eosin.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio-vikas-eosin.vercel.app/" />
    <meta
      property="og:title"
      content="Vikas Bhardwaj — Full-Stack &amp; Applied AI Product Engineer"
    />
    <meta
      property="og:description"
      content="Featured product-engineering builds and earlier projects: offline-first agriculture, AI telemetry, native systems, direct ordering, and practical web applications."
    />
    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Vikas Bhardwaj — Full-Stack &amp; Applied AI Product Engineer"
    />
    <meta
      name="twitter:description"
      content="End-to-end web applications, agentic AI workflows, and native browser/system tools—from fuzzy real-world problems to live deployment."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Vikas Bhardwaj — Full-Stack &amp; Applied AI Product Engineer</title>
    <script>
      try {
        const theme = localStorage.getItem('portfolio-theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content =
            theme === 'dark' ? '#0a0b0c' : '#f7f7f2';
        }
      } catch {
        // The portfolio also works when browser storage is unavailable.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
